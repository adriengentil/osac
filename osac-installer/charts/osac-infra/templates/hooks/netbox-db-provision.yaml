{{- if and .Values.netbox.enabled .Values.bundledPostgres.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-netbox-db-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
---
# The Job execs into the bundled PostgreSQL pod to run idempotent SQL, so it
# needs to find the pod and open an exec session. These are regular release
# resources, not hooks: Helm applies them before the post-install provision
# Job runs (same pattern as netbox-token-seed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-netbox-db-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-db-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-netbox-db-provision
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-db-provision
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-netbox-db-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Runs after apply-ca-bundle (12) so the PostgreSQL pod can mount the
    # ca-bundle ConfigMap on fresh installs, and before netbox-token-seed
    # (14), which waits on a NetBox deployment that needs this database.
    helm.sh/hook-weight: "13"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "osac-infra.cliJobPodSecurityContext" . | nindent 8 }}
      serviceAccountName: {{ .Release.Name }}-netbox-db-provision
      containers:
      - name: provision
        image: {{ .Values.cliImage }}
        command: ["/bin/sh", "/scripts/netbox-db-provision.sh"]
        env:
        - name: POD_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.hookResources | nindent 10 }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: osac-infra-hook-scripts
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
{{- end }}
