{{- if .Values.netbox.enabled }}
---
# Pre-install Job: generates random credentials and creates credentialsSecret
# before the NetBox subchart starts. Idempotent — skips creation if the Secret
# already exists so upgrades leave existing credentials intact.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: {{ .Values.cliImage }}
        command:
        - /bin/sh
        - -ec
        - |
          SECRET="{{ default "netbox-credentials" .Values.netbox.existingSecret }}"
          NS="{{ .Release.Namespace }}"

          if kubectl -n "${NS}" get secret "${SECRET}" > /dev/null 2>&1; then
            echo "Secret ${SECRET} already exists — skipping."
            exit 0
          fi

          kubectl -n "${NS}" create secret generic "${SECRET}" \
            --from-literal=secret_key="$(openssl rand -hex 32)" \
            --from-literal=superuser_password="$(openssl rand -hex 16)" \
            --from-literal=db_password="$(openssl rand -hex 16)" \
            --from-literal=api_token="$(openssl rand -hex 20)"

          echo "Secret ${SECRET} created in namespace ${NS}."
      serviceAccountName: {{ .Release.Name }}-netbox-credentials-init
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-netbox-credentials-init
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
---
# Post-install Job: waits for NetBox to become ready, registers the API token
# from credentialsSecret, then writes apiTokenSecret into operatorNamespace so
# the bare-metal-fulfillment-operator can mount it as its inventory credential.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: {{ .Values.cliImage }}
        command:
        - /bin/sh
        - -ec
        - |
          NETBOX_URL="http://{{ .Release.Name }}-netbox.{{ .Release.Namespace }}.svc.cluster.local"
          OPERATOR_NS="{{ .Values.osacNamespace }}"
          SECRET_NAME="{{ default "netbox-api-token" .Values.netbox.apiTokenSecret }}"
          SUPERUSER="{{ default "admin" .Values.netbox.superuser.name }}"
          PASSWORD="$(cat /credentials/superuser_password)"
          TOKEN="$(cat /credentials/api_token)"

          # Wait for NetBox API to become ready
          until curl -sf "${NETBOX_URL}/api/" > /dev/null; do
            echo "Waiting for NetBox..."
            sleep 5
          done

          # Register the token in NetBox (no-op if it already exists)
          curl -sf -X POST "${NETBOX_URL}/api/users/tokens/" \
            -u "${SUPERUSER}:${PASSWORD}" \
            -H "Content-Type: application/json" \
            -d "{\"key\": \"${TOKEN}\", \"description\": \"osac-operator\"}" \
            > /dev/null || echo "Token may already exist, continuing."

          # Write the token Secret into the operator namespace
          kubectl -n "${OPERATOR_NS}" create secret generic "${SECRET_NAME}" \
            --from-literal=token="${TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Secret ${SECRET_NAME} written to namespace ${OPERATOR_NS}."
        volumeMounts:
        - name: credentials
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: credentials
        secret:
          secretName: {{ default "netbox-credentials" .Values.netbox.existingSecret }}
          items:
          - key: superuser_password
            path: superuser_password
          - key: api_token
            path: api_token
      serviceAccountName: {{ .Release.Name }}-netbox-token-seed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
---
# ClusterRole: write apiTokenSecret into operatorNamespace (different from Release.Namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-netbox-token-seed
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
{{- end }}
