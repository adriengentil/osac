{{- if .Values.netbox.enabled }}
---
# Seed Job: waits for NetBox to become ready, registers a superuser API token,
# and writes it as a Secret into the operator namespace (netbox.operatorNamespace)
# so the bare-metal-fulfillment-operator can mount it as its inventory credential.
#
# Token selection (in priority order):
#   1. netbox.existingSecret key "api_token" — CI supplies a fixed, known value so
#      the osac chart (T3/OSAC-6198) can reference it predictably in the inventory
#      config without reading from the cluster at render time.
#   2. Auto-generated by the NetBox REST API — used when no pre-set token is provided.
#
# Pre-existing Secret (netbox.existingSecret) must be created before helm install-infra.
# Required keys: secret_key, superuser_password, db_password.
# Optional key:  api_token — fixed token value for CI; NetBox registers it on first run.
apiVersion: batch/v1
kind: Job
metadata:
  name: netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: quay.io/curl/curl:latest
        command:
        - /bin/sh
        - -ec
        - |
          NETBOX_URL="http://{{ .Release.Name }}-netbox.{{ .Release.Namespace }}.svc.cluster.local"
          OPERATOR_NS="{{ .Values.netbox.operatorNamespace }}"
          SECRET_NAME="{{ .Values.netbox.apiTokenSecret }}"
          SUPERUSER="{{ .Values.netbox.superuser.name }}"

          # Wait for NetBox API to become ready
          until curl -sf "${NETBOX_URL}/api/" > /dev/null; do
            echo "Waiting for NetBox..."
            sleep 5
          done

          PASSWORD="$(cat /credentials/superuser_password)"

          # Use a pre-set token if provided (CI path), otherwise auto-generate.
          if [ -f /credentials/api_token ] && [ -s /credentials/api_token ]; then
            PRESET_TOKEN="$(cat /credentials/api_token)"
            echo "Registering pre-set API token in NetBox..."
            # Create the token in NetBox with the exact key value
            curl -sf -X POST "${NETBOX_URL}/api/users/tokens/" \
              -u "${SUPERUSER}:${PASSWORD}" \
              -H "Content-Type: application/json" \
              -d "{\"key\": \"${PRESET_TOKEN}\", \"description\": \"osac-operator\"}" \
              > /dev/null || echo "Token may already exist, continuing..."
            TOKEN="${PRESET_TOKEN}"
          else
            echo "No pre-set api_token found; requesting auto-generated token from NetBox..."
            TOKEN=$(curl -sf -X POST "${NETBOX_URL}/api/users/tokens/" \
              -u "${SUPERUSER}:${PASSWORD}" \
              -H "Content-Type: application/json" \
              -d "{\"description\": \"osac-operator\"}" \
              | grep -o '"key":"[^"]*"' | sed 's/"key":"//;s/"//g')
          fi

          if [ -z "${TOKEN}" ]; then
            echo "Failed to obtain NetBox API token"
            exit 1
          fi

          # Write the token Secret into the operator namespace so the
          # bare-metal-fulfillment-operator can mount it as its inventory credential.
          kubectl -n "${OPERATOR_NS}" create secret generic "${SECRET_NAME}" \
            --from-literal=token="${TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Secret ${SECRET_NAME} written to namespace ${OPERATOR_NS}"
        volumeMounts:
        - name: credentials
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: credentials
        secret:
          secretName: {{ .Values.netbox.existingSecret }}
          items:
          - key: superuser_password
            path: superuser_password
          - key: api_token
            path: api_token
            # optional: true is not supported in this API version; the file
            # simply won't exist if the key is absent, which the script handles.
      serviceAccountName: {{ .Release.Name }}-netbox-token-seed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
---
# ClusterRole needed to write the token Secret into the operator namespace
# (netbox.operatorNamespace), which differs from this chart's release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-netbox-token-seed
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
{{- end }}
