{{- if .Values.netbox.enabled }}
---
# Custom SCC for the NetBox subchart (Bitnami).
# Bitnami hardcodes UID 1000, fsGroup 1000, and sets seccomp RuntimeDefault
# annotations that the built-in anyuid SCC rejects. This SCC allows RunAsAny
# for user/group/fsGroup and permits seccomp so the chart runs unmodified.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ .Release.Name }}-netbox
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: "SCC for NetBox subchart — allows Bitnami hardcoded UID 1000 and seccomp"
allowPrivilegedContainer: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
- KILL
- MKNOD
- SETUID
- SETGID
seccompProfiles:
- runtime/default
- docker/default
allowedUnsafeSysctls: []
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
- configMap
- downwardAPI
- emptyDir
- persistentVolumeClaim
- projected
- secret
users:
- system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}-netbox
groups: []
---
# Pre-install Job: generates random credentials and creates existingSecret
# before the NetBox subchart starts. Idempotent — skips creation if the Secret
# already exists so upgrades leave existing credentials intact.
#
# Keys written:
#   secret_key          — Django secret key
#   superuser_password  — NetBox superuser password
#   db_password         — PostgreSQL password
#   api_token_peppers   — JSON dict required by NetBox 4.7 for v2 HMAC tokens
#                         format: "1" mapped to a 64-char hex string
#   email_password      — Empty; the chart mounts this key unconditionally
#                         even when email is not configured
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: {{ .Values.cliImage }}
        command:
        - /bin/sh
        - -ec
        - |
          SECRET="{{ default "netbox-credentials" .Values.netbox.existingSecret }}"
          NS="{{ .Release.Namespace }}"

          if oc -n "${NS}" get secret "${SECRET}" > /dev/null 2>&1; then
            echo "Secret ${SECRET} already exists — skipping."
            exit 0
          fi

          PEPPER=$(openssl rand -hex 32)

          oc -n "${NS}" create secret generic "${SECRET}" \
            --from-literal=secret_key="$(openssl rand -hex 32)" \
            --from-literal=superuser_password="$(openssl rand -hex 16)" \
            --from-literal=db_password="$(openssl rand -hex 16)" \
            --from-literal=api_token_peppers="{\"1\": \"${PEPPER}\"}" \
            --from-literal=email_password=""

          echo "Secret ${SECRET} created in namespace ${NS}."
      serviceAccountName: {{ .Release.Name }}-netbox-credentials-init
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-netbox-credentials-init
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-credentials-init
  namespace: {{ .Release.Namespace }}
---
# Post-install Job: waits for the NetBox Deployment to roll out, then
# creates an API token via manage.py shell inside the running NetBox pod.
#
# Why oc exec instead of the REST API:
#   NetBox 4.7 uses v2 HMAC tokens. The full token value (nbt_{key}.{plaintext})
#   is only available in memory at creation time — the plaintext is never
#   persisted to the database. Running token creation inside the NetBox pod
#   via manage.py shell is the only way to capture both parts in one session.
#
# The resulting token is written as Secret apiTokenSecret in osacNamespace
# so the bare-metal-fulfillment-operator can mount it as its inventory credential.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: {{ .Values.cliImage }}
        command:
        - /bin/sh
        - -ec
        - |
          DEPLOY="{{ .Release.Name }}-netbox"
          NS="{{ .Release.Namespace }}"
          OPERATOR_NS="{{ .Values.osacNamespace }}"
          SECRET_NAME="{{ default "netbox-api-token" .Values.netbox.apiTokenSecret }}"

          # Wait for the NetBox Deployment to finish rolling out
          echo "Waiting for NetBox rollout..."
          oc rollout status deployment/"${DEPLOY}" -n "${NS}" --timeout=10m

          # Find a ready NetBox pod
          POD=$(oc get pod -n "${NS}" \
            -l "app.kubernetes.io/name=netbox,app.kubernetes.io/component=netbox" \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Using pod: ${POD}"

          # Create a v2 API token inside the NetBox pod via manage.py shell.
          # The Python is a single semicolon-separated line to avoid YAML
          # literal-block indentation conflicts.
          # Captures nbt_{key}.{plaintext} — the full token for Authorization.
          PY='from users.models import Token; from users.constants import TOKEN_PREFIX; from django.contrib.auth import get_user_model; import sys; User = get_user_model(); admin = User.objects.get(username="admin"); Token.objects.filter(user=admin).delete(); t = Token(user=admin, description="osac-operator"); t.save(); sys.stdout.write(TOKEN_PREFIX + t.key + "." + t._token)'

          TOKEN=$(oc exec -n "${NS}" "${POD}" -- \
            bash -c "cd /opt/netbox/netbox && \
              /opt/netbox/venv/bin/python manage.py shell --no-startup -c '${PY}' \
              2>/dev/null" | grep "^nbt_")

          if [ -z "${TOKEN}" ]; then
            echo "Failed to generate NetBox API token"
            exit 1
          fi

          echo "Token generated (key: ${TOKEN%%.*})"

          # Write the token Secret into the operator namespace
          oc -n "${OPERATOR_NS}" create secret generic "${SECRET_NAME}" \
            --from-literal=token="${TOKEN}" \
            --dry-run=client -o yaml | oc apply -f -

          echo "Secret ${SECRET_NAME} written to namespace ${OPERATOR_NS}."
      serviceAccountName: {{ .Release.Name }}-netbox-token-seed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
---
# Role: list/get pods and exec into them (within osac-infra namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-netbox-token-seed
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
---
# ClusterRole: write apiTokenSecret into osacNamespace (differs from Release.Namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-netbox-token-seed
  labels:
    {{- include "osac-infra.hookLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-netbox-token-seed
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-netbox-token-seed
  namespace: {{ .Release.Namespace }}
{{- end }}
