# BMaaS-NetBox CI environment -- infrastructure values for osac-deps + osac-infra charts.
# Identical to bmaas-ci except NetBox is enabled as the bare-metal inventory backend
# in place of Metal3/BMH.
#
# Prerequisites (created by the CI bootstrap script before helm install-infra):
#   kubectl create secret generic netbox-secret \
#     --namespace osac-infra \
#     --from-literal=secret_key="$(openssl rand -hex 32)" \
#     --from-literal=superuser_password="netbox-ci-admin" \
#     --from-literal=db_password="netbox-ci-db" \
#     --from-literal=api_token="$(openssl rand -hex 20)"
#
# The api_token value is registered in NetBox by the post-install seed Job and
# written as Secret "netbox-api-token" in the osac namespace so the
# bare-metal-fulfillment-operator can mount it as its inventory credential
# (wired in OSAC-6198 / T3). Keep the same token value across reinstalls so
# the operator config does not need to be regenerated.

# --- OLM Subscriptions (osac-deps) ---
certManager:
  enabled: true
trustManager:
  enabled: true
aapOperator:
  enabled: true
lvms:
  enabled: true
metallb:
  enabled: false
cnv:
  enabled: false
mce:
  enabled: false

# --- Infrastructure (osac-infra) ---
caIssuer:
  enabled: true
keycloak:
  enabled: true
  devFixtures:
    enabled: true
kafka:
  enabled: true

# --- NetBox ---
netbox:
  enabled: true
  superuser:
    enabled: true
    name: admin
    email: admin@osac.local
  existingSecret: "netbox-secret"
  apiTokenSecret: "netbox-api-token"
  # Pass through subchart values for CI sizing
  postgresql:
    enabled: true
    auth:
      existingSecret: "netbox-secret"
      secretKeys:
        adminPasswordKey: db_password
        userPasswordKey: db_password
    primary:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
  valkey:
    enabled: true
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 64Mi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi

# --- Bundled PostgreSQL ---
bundledPostgres:
  enabled: true
  database:
    name: service
    user: service

# --- Bundled OpenBao ---
bundledVault:
  enabled: true
  devRootToken: "dev-root-token"
  podSecurityContext:
    runAsNonRoot: true
