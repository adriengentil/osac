# BMaaS-NetBox CI environment -- infrastructure values for osac-deps + osac-infra charts.
# Identical to bmaas-ci except NetBox is enabled as the bare-metal inventory backend
# in place of Metal3/BMH.
#
# No manual secret bootstrap required: the pre-install Job generates all NetBox
# credentials (secret_key, superuser_password, db_password, api_token) and writes
# them into "netbox-credentials" automatically. The post-install seed Job registers
# the api_token with NetBox and writes "netbox-api-token" into the osac namespace for
# the bare-metal-fulfillment-operator (wired in OSAC-6198 / T3).

# --- OLM Subscriptions (osac-deps) ---
certManager:
  enabled: true
trustManager:
  enabled: true
aapOperator:
  enabled: true
lvms:
  enabled: true
metallb:
  enabled: false
cnv:
  enabled: false
mce:
  enabled: false

# --- Infrastructure (osac-infra) ---
caIssuer:
  enabled: true
keycloak:
  enabled: true
  devFixtures:
    enabled: true
kafka:
  enabled: true

# --- NetBox ---
netbox:
  enabled: true
  superuser:
    enabled: true
    name: admin
    email: admin@osac.local
  credentialsSecret: "netbox-credentials"
  apiTokenSecret: "netbox-api-token"
  # Pass through subchart values for CI sizing
  postgresql:
    enabled: true
    auth:
      existingSecret: "netbox-credentials"
      secretKeys:
        adminPasswordKey: db_password
        userPasswordKey: db_password
    primary:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
  valkey:
    enabled: true
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 64Mi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi

# --- Bundled PostgreSQL ---
bundledPostgres:
  enabled: true
  database:
    name: service
    user: service

# --- Bundled OpenBao ---
bundledVault:
  enabled: true
  devRootToken: "dev-root-token"
  podSecurityContext:
    runAsNonRoot: true
