# BMaaS-NetBox CI overlay — applied on top of bmaas-ci/infra.yaml.
# Contains only the values that differ from the bmaas-ci base profile.
#
# A pre-install Job generates all NetBox credentials (secret_key,
# superuser_password, db_password, api_token) into existingSecret automatically.
# The post-install seed Job registers the api_token with NetBox and writes
# "netbox-api-token" into the osac namespace for the bare-metal-fulfillment-operator
# (wired in OSAC-6198 / T3).

netbox:
  enabled: true
  # existingSecret is the netbox chart's own field for credential lookup.
  # The pre-install Job creates this Secret with all required keys.
  existingSecret: "netbox-credentials"
  superuser:
    enabled: true
    name: admin
    email: admin@osac.local
  postgresql:
    enabled: true
    auth:
      existingSecret: "netbox-credentials"
      secretKeys:
        adminPasswordKey: db_password
        userPasswordKey: db_password
    primary:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
  valkey:
    enabled: true
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 64Mi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi
